name: FREE THE DECO LAB safety

on:
  push:
    paths:
      - "deco-control-lab/**"
      - ".github/workflows/check-deco-control-lab.yml"
  pull_request:
    paths:
      - "deco-control-lab/**"
      - ".github/workflows/check-deco-control-lab.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile source
        run: python -m compileall -q deco-control-lab/src deco-control-lab/tests

      - name: Install dependencies
        run: python -m pip install --requirement deco-control-lab/requirements.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Run guardrail tests
        env:
          PYTHONPATH: deco-control-lab/src
        run: python -m unittest discover -s deco-control-lab/tests -v

      - name: Build App container
        run: >-
          docker build
          --build-arg BUILD_VERSION=2.0.0
          --build-arg BUILD_ARCH=amd64
          --tag deco-control-lab:test
          deco-control-lab

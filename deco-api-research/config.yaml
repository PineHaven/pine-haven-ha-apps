name: "FREE THE DECO"
version: "1.2.1"
slug: "deco_api_research"
description: >-
  Pine Haven's local-first TP-Link Deco mesh monitor and research platform.
url: "https://github.com/PineHaven/pine-haven-ha-apps/tree/main/deco-api-research"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: stable
ingress: true
ingress_port: 8099
panel_icon: mdi:router-network
panel_title: FREE THE DECO
homeassistant_api: true
options:
  monitoring_enabled: false
  exclusive_session_acknowledged: false
  poll_interval_seconds: 60
  stale_after_intervals: 3
  publish_to_home_assistant: true
  node_aliases_json: "{}"
  verify_ssl: false
schema:
  monitoring_enabled: bool
  exclusive_session_acknowledged: bool
  poll_interval_seconds: int(30,3600)
  stale_after_intervals: int(2,10)
  publish_to_home_assistant: bool
  node_aliases_json: str
  host: url?
  username: str?
  password: password?
  verify_ssl: bool
